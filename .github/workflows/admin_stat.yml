name: 드림몰 Admin 통계

on:
  # 현재 사용하지 않아 자동 실행(schedule)은 주석 처리. 다시 쓰려면 아래 3줄의 주석을 푼다.
  #   - 매주 월요일 00:02 UTC (09:02 KST): 주간 매출 통계 (--sales-weekly)
  #   - 매월 1일   00:02 UTC (09:02 KST): 월간 매출 통계 (--sales-monthly)
  #   (1일이 월요일이면 두 번 실행되어 주간·월간을 각각 보냄)
  # schedule:
  #   - cron: '2 0 * * 1'
  #   - cron: '2 0 1 * *'
  workflow_dispatch:
    inputs:
      report:
        description: '보낼 매출 통계'
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly

jobs:
  run_stats:
    runs-on: ubuntu-latest

    # admin_stat 폴더 안에서 실행 (루트의 report/ 패키지와 섞이지 않도록)
    defaults:
      run:
        working-directory: admin_stat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable fonts-nanum

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          LOGIN_USER_FIELD: ${{ secrets.LOGIN_USER_FIELD }}
          LOGIN_PASS_FIELD: ${{ secrets.LOGIN_PASS_FIELD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_FROM_NUMBER: ${{ secrets.SOLAPI_FROM_NUMBER }}
          KAKAO_CHANNEL_ID: ${{ secrets.KAKAO_CHANNEL_ID }}
          KAKAO_TO: ${{ secrets.KAKAO_TO }}
          B2B_ADMIN_USER: ${{ secrets.B2B_ADMIN_USER }}
          B2B_ADMIN_PASS: ${{ secrets.B2B_ADMIN_PASS }}
          SALES_EMAIL_TO: ${{ secrets.SALES_EMAIL_TO }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT: ${{ inputs.report }}
        run: |
          if [ "$SCHEDULE" = "2 0 * * 1" ] || [ "$REPORT" = "weekly" ]; then
            python main.py --sales-weekly
          elif [ "$SCHEDULE" = "2 0 1 * *" ] || [ "$REPORT" = "monthly" ]; then
            python main.py --sales-monthly
          else
            echo "실행 조건을 알 수 없음 (schedule='$SCHEDULE', report='$REPORT')"
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-stat-reports
          path: admin_stat/reports/
          retention-days: 30
